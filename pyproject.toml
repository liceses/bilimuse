[project]
name = "bilimuse"
version = "0.1.0"
description = "Bilibili 音乐下载器：歌词/歌名搜索（含歌词正文反查）→ 选版本 → 下载 → 自动打标签/歌词 → whisper 时间轴校准"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [
    { name = "liceses", email = "1801203413@qq.com" },
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "typer>=0.12",
    "mutagen>=1.47",
    "qrcode>=7.4",
    "cryptography>=42.0",
]

[project.optional-dependencies]
align = [
    "lyric-align[asr]>=0.3",
]
separate = [
    "lyric-align[separate]>=0.3",
]
ffmpeg = [
    "imageio-ffmpeg>=0.5",
]
tui = [
    "textual>=0.8",
]
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
bilimuse = "bilimuse.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["bilimuse*"]

[tool.setuptools.package-data]
bilimuse = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
lint.ignore = ["B008"]
