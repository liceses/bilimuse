[project]
name = "musicalbili"
version = "0.1.0"
description = "Bilibili 音乐下载器：搜索/选版本/下载/打标签/配歌词/校准时间轴"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "typer>=0.12",
    "mutagen>=1.47",
    "qrcode>=7.4",
    "cryptography>=42.0",
]

[project.optional-dependencies]
align = [
    "lyric-align[asr]>=0.3",
]
separate = [
    "lyric-align[separate]>=0.3",
]
ffmpeg = [
    "imageio-ffmpeg>=0.5",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
musicalbili = "musicalbili.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["musicalbili*"]

[tool.setuptools.package-data]
musicalbili = ["web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
lint.ignore = ["B008"]
