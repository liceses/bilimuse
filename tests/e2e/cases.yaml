# BiliMuse E2E 测试集用例定义（已实地固化标准答案）
# expect 为机器校验标准答案；review 为人工评审项。
# bvid 已由 2026-08-04 实测固化；同一 bvid 不同 format 由运行器按 key=bvid:fmt:align 复用缓存。

cases:
  # ============ 中文经典 ============
  - id: C01
    name: "周杰伦-晴天（歌名直搜）"
    category: 中文经典
    query: "周杰伦 晴天"
    bvid: "BV1d4411N7zD"
    format: m4a
    expect:
      artist: "周杰伦"
      title: "晴天"
      album: "叶惠美"
      duration_range: [290, 340]
      language: zh
      lyric_keywords: ["消失的下雨天"]
      lyric_source_in: [lrclib, netease, bilibili]
      calib_method_in: [synced, scale, align, align_offset, source]
    review:
      - item: "歌词对齐质量"

  - id: C02
    name: "周杰伦-七里香（歌名直搜）"
    category: 中文经典
    query: "周杰伦 七里香"
    bvid: "BV1qD4y1U7fs"
    format: m4a
    expect:
      artist: "周杰伦"
      title: "七里香"
      duration_range: [270, 320]
      language: zh
      lyric_keywords: ["窗外的麻雀"]
      lyric_source_in: [lrclib, netease, bilibili]
    review:
      - item: "歌词对齐质量"

  - id: C03
    name: "周杰伦-搁浅（官方MV）"
