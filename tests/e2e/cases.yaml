      title: "双截棍"
      duration_range: [180, 230]
      language: zh
      lyric_source_in: [lrclib, netease, bilibili]
    review:
      - item: "快歌对齐质量"

  # ============ 歌词片段反查 ============
  - id: C06
    name: "歌词反查-七里香（中）"
    category: 歌词反查
    query: "窗外的麻雀 在电线杆上多嘴"
    bvid: "BV1qD4y1U7fs"
    format: m4a
    search_expect:
      min_hits: 1
      lyric_hit: true
    expect:
      artist: "周杰伦"
      title: "七里香"
      duration_range: [270, 320]
      language: zh
    review:
      - item: "反查歌名是否准确"

  - id: C07
    name: "歌词反查-搁浅（中）"
