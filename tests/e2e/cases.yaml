    format: m4a
    expect:
      artist: "周杰伦"
      title: "搁浅"
      duration_range: [240, 290]
      language: zh
      lyric_source_in: [lrclib, netease, bilibili]
    review:
      - item: "歌词对齐质量"

  - id: C04
    name: "周杰伦-以父之名（官方MV）"
